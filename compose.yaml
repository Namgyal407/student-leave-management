name: student-leave-management
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leave_management
      POSTGRES_USER: leave_app
      POSTGRES_PASSWORD: leave_app_password
    volumes:
      - leave_postgres_data:/var/lib/postgresql/data
      # Schema is loaded only on the first startup of an empty database volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_app -d leave_management && psql -U leave_app -d leave_management -tAc \"SELECT to_regclass('public.v_leave_details') IS NOT NULL\" | grep -q t"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://leave_app:leave_app_password@db:5432/leave_management
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-before-production-2026}
      JWT_EXPIRY_HOURS: 24
      CORS_ORIGINS: http://localhost:5000
      PORT: 5000
      FLASK_DEBUG: 0
      HOST: 0.0.0.0
      DEMO_SEED: 1
      UPLOAD_FOLDER: /app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - leave_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  leave_postgres_data:
  leave_uploads:
